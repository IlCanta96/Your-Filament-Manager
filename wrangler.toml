name = "your-filament-manager"
main = "worker.js"
compatibility_date = "2025-02-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "FILAMENT_STORE"
class_name = "FilamentStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FilamentStore"]

[triggers]
crons = ["* * * * *"]
